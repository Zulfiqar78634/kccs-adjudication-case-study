name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # The confidential workbook is not in the repository, so workbook-backed tests skip in CI;
      # synthetic-fixture tests still run. Run the full suite locally with the workbook in data/.
      - run: python -m pytest -q
