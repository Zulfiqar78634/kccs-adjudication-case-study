[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kccs-evidence-kernel"
version = "0.1.0"
description = "Tenant-scoped, temporally correct evidence-resolution and replay kernel (KCCS Sentinel case study prototype)"
requires-python = ">=3.11"
dependencies = [
  "openpyxl==3.1.5",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.17.4"]

[project.scripts]
kccs-evidence = "kccs_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kccs_evidence = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, modern syntax, likely bugs, simplifications
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# `ruff format` enforces line length; the lines it leaves long are single message strings.
ignore = ["E501"]
